{% extends "base.html" %}
{% block title %}Forgot Password — DxdPanel{% endblock %}
{% block body %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo"><div class="auth-logo-mark" style="animation:glowPulse 2.5s ease infinite;">D</div><div class="auth-title">Reset password</div></div>
    {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
    <form method="post">
      <div class="form-group"><label class="form-label">Username</label><input name="username" class="form-input" autofocus></div>
      <div class="form-group"><label class="form-label">Recovery code</label><input name="code" class="form-input" placeholder="XXXXXX" style="font-family:var(--mono);letter-spacing:.12em;text-transform:uppercase;"></div>
      <button type="submit" class="btn btn-purple btn-full">Verify</button>
    </form>
    <div style="text-align:center;margin-top:1rem;font-size:.76rem;"><a href="{{ url_for('login') }}" style="color:var(--text-2);">Back to sign in</a></div>
  </div>
</div>
{% endblock %}
