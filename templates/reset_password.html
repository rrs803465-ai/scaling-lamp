{% extends "base.html" %}
{% block title %}New Password — DxdPanel{% endblock %}
{% block body %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo"><div class="auth-logo-mark" style="animation:glowPulse 2.5s ease infinite;">D</div><div class="auth-title">Set new password</div></div>
    {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
    <form method="post">
      <div class="form-group"><label class="form-label">New password</label><input name="password" type="password" class="form-input" placeholder="min 6 characters" autofocus></div>
      <button type="submit" class="btn btn-purple btn-full">Update password</button>
    </form>
  </div>
</div>
{% endblock %}
