{% extends "base.html" %}
{% block title %}Sign in — DxdPanel{% endblock %}
{% block body %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-mark" style="animation:glowPulse 2.5s ease infinite;">D</div>
      <div class="auth-title">Sign in to DxdPanel</div>
      <div class="auth-sub">Booster Panel</div>
    </div>
    {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
    <form method="post">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input name="username" class="form-input" placeholder="your_username" autocomplete="username" autofocus>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input name="password" type="password" class="form-input" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-purple btn-full" style="margin-top:.5rem;">Sign in</button>
    </form>
    <div style="text-align:center;margin-top:1.25rem;display:flex;justify-content:center;gap:1.5rem;font-size:.76rem;">
      <a href="{{ url_for('register') }}" style="color:var(--text-2);">Create account</a>
      <a href="{{ url_for('forgot_password') }}" style="color:var(--text-2);">Forgot password</a>
    </div>
  </div>
</div>
{% endblock %}
